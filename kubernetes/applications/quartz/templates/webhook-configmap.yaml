---
apiVersion: v1
kind: ConfigMap
metadata:
  name: quartz-webhook-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: quartz
    app.kubernetes.io/component: webhook
data:
  server.js: |
    'use strict';
    const http = require('http');
    const { execSync, spawn } = require('child_process');
    const fs = require('fs');
    const path = require('path');

    // ---------------------------------------------------------------------------
    // Configuration
    // ---------------------------------------------------------------------------
    const COUCHDB_HOST     = process.env.COUCHDB_HOST     || 'http://obsidian-livesync.obsidian-livesync.svc:5984';
    const COUCHDB_USER     = process.env.COUCHDB_USER     || '';
    const COUCHDB_PASSWORD = process.env.COUCHDB_PASSWORD || '';
    const COUCHDB_DATABASE = process.env.COUCHDB_DATABASE || 'obsidiannotes';
    const REPO_DIR   = '/repo/garden';
    const CONTENT_DIR = path.join(REPO_DIR, 'content');
    const SITE_DIR   = '/site/output';
    const QUARTZ_REPO = 'https://github.com/jackyzha0/quartz.git';
    const HEALTH_PORT = 9000;

    const AUTH_HEADER = 'Basic ' + Buffer.from(COUCHDB_USER + ':' + COUCHDB_PASSWORD).toString('base64');
    const TEXT_EXTS = new Set(['.md', '.canvas', '.txt', '.csv', '.json', '.yaml', '.yml', '.html', '.css', '.js', '.ts']);

    // ---------------------------------------------------------------------------
    // State
    // ---------------------------------------------------------------------------
    // All three triggers (startup, CouchDB changes, POST /rebuild) go through
    // requestSync(). Only one sync+build job runs at a time; anything requested
    // while a job is running collapses into a single follow-up job.
    var isReady    = false;
    var phase      = 'starting';   // starting | idle | syncing | building
    var jobRunning = false;
    var jobQueued  = false;
    var jobTimer   = null;
    var lastResult = 'No sync has run yet.';

    // ---------------------------------------------------------------------------
    // CouchDB client
    // ---------------------------------------------------------------------------
    function couchRequest(method, urlPath, body, timeoutMs) {
      if (!timeoutMs) timeoutMs = 60000;
      return new Promise(function(resolve, reject) {
        var base = new URL(COUCHDB_HOST);
        var payload = body ? Buffer.from(JSON.stringify(body)) : null;
        var headers = { Authorization: AUTH_HEADER, Accept: 'application/json' };
        if (payload) {
          headers['Content-Type'] = 'application/json';
          headers['Content-Length'] = payload.length;
        }
        var req = http.request({
          hostname: base.hostname,
          port: parseInt(base.port) || 5984,
          path: urlPath,
          method: method,
          headers: headers,
          timeout: timeoutMs,
        }, function(res) {
          // Collect raw Buffers and decode once: decoding per network chunk
          // corrupts multi-byte UTF-8 characters split across chunk boundaries.
          var parts = [];
          res.on('data', function(c) { parts.push(c); });
          res.on('end', function() {
            var data;
            try { data = JSON.parse(Buffer.concat(parts).toString('utf8')); }
            catch (e) { return reject(new Error('Invalid JSON from CouchDB (HTTP ' + res.statusCode + ')')); }
            if (res.statusCode >= 400) {
              return reject(new Error('CouchDB HTTP ' + res.statusCode + ': ' + (data.reason || data.error)));
            }
            resolve(data);
          });
        });
        req.on('error', reject);
        req.on('timeout', function() { req.destroy(new Error('CouchDB timeout')); });
        if (payload) req.write(payload);
        req.end();
      });
    }

    function dbPath(suffix) {
      return '/' + encodeURIComponent(COUCHDB_DATABASE) + suffix;
    }

    function getDbInfo() {
      return couchRequest('GET', dbPath(''));
    }

    // Changes are only used as a trigger, so docs are not included: a LiveSync
    // push can produce thousands of chunk changes in one response.
    function watchChanges(since) {
      var seq = encodeURIComponent(String(since));
      return couchRequest('GET', dbPath('/_changes?feed=longpoll&since=' + seq + '&timeout=60000'), null, 70000);
    }

    // ---------------------------------------------------------------------------
    // Vault sync — memory stays bounded by one page of file docs plus one group
    // of chunks, regardless of vault size.
    //
    // Phase 1 lists the file docs. LiveSync stores content chunks under ids
    // prefixed "h:", which make up nearly all of the database, so that key range
    // is skipped. _all_docs sorts ids by raw byte order and ';' sorts directly
    // after ':', so the two ranges below cover every id except "h:*".
    //
    // Phase 2 fetches each file's chunks by id and appends them to the file.
    // Files are written to a staging dir that replaces content/ only once the
    // whole sync succeeds, so a failed sync never leaves the site half-written.
    // ---------------------------------------------------------------------------
    var PAGE_SIZE        = 200;
    var CHUNK_GROUP_SIZE = 50;
    var STAGING_DIR      = path.join(REPO_DIR, '.content-staging');
    var KEY_RANGES = [
      { endkey: 'h:' },
      { startkey: 'h;' },
    ];

    // Paginates by startkey rather than skip: skip makes CouchDB walk every
    // earlier row on each request, so a full listing was quadratic.
    function listFileDocs(range, startkey, out) {
      var q = ['include_docs=true', 'limit=' + (PAGE_SIZE + 1)];
      if (startkey !== undefined) q.push('startkey=' + encodeURIComponent(JSON.stringify(startkey)));
      if (range.endkey !== undefined) {
        q.push('endkey=' + encodeURIComponent(JSON.stringify(range.endkey)));
        q.push('inclusive_end=false');
      }
      return couchRequest('GET', dbPath('/_all_docs?' + q.join('&'))).then(function(data) {
        var rows = data.rows || [];
        var nextKey = rows.length > PAGE_SIZE ? rows[PAGE_SIZE].id : undefined;
        rows.slice(0, PAGE_SIZE).forEach(function(r) {
          var d = r.doc;
          if (!d || !d.path) return;
          if (d.type === 'leaf' || d.type === 'versioninfo') return;
          if (d._deleted || d.deleted) return;
          if (!isPublishable(d.path)) return;
          // Older LiveSync versions keep recently written chunks inline in
          // "eden" until they are moved out to their own docs.
          out.push({ path: d.path, children: d.children || [], eden: d.eden || {} });
        });
        return nextKey === undefined ? out : listFileDocs(range, nextKey, out);
      });
    }

    // Writes one file from its chunks; resolves to the number of missing chunks.
    function writeFileFromChunks(fileDoc, dest) {
      var ids = fileDoc.children;
      var isText = isTextFile(fileDoc.path);
      var missing = 0;
      fs.mkdirSync(path.dirname(dest), { recursive: true });
      fs.writeFileSync(dest, '');

      function writeGroup(i) {
        if (i >= ids.length) return Promise.resolve(missing);
        var group = ids.slice(i, i + CHUNK_GROUP_SIZE);
        return couchRequest('POST', dbPath('/_all_docs?include_docs=true'), { keys: group }).then(function(data) {
          var byId = {};
          (data.rows || []).forEach(function(r) { if (r.doc) byId[r.id] = r.doc.data || ''; });
          group.forEach(function(id) {
            var chunk = byId[id];
            if (chunk === undefined && fileDoc.eden[id]) chunk = fileDoc.eden[id].data || '';
            if (chunk === undefined) { missing++; return; }
            // Binary chunks are each base64-encoded with their own padding, so
            // they must be decoded individually rather than joined first.
            fs.appendFileSync(dest, Buffer.from(chunk, isText ? 'utf8' : 'base64'));
          });
          return writeGroup(i + CHUNK_GROUP_SIZE);
        });
      }
      return writeGroup(0);
    }

    function syncVault() {
      var started = Date.now();
      var files = [];
      var incomplete = [];

      return KEY_RANGES.reduce(function(p, range) {
        return p.then(function() { return listFileDocs(range, range.startkey, files); });
      }, Promise.resolve()).then(function() {
        console.log('Found ' + files.length + ' publishable files, fetching content...');
        fs.rmSync(STAGING_DIR, { recursive: true, force: true });
        fs.mkdirSync(STAGING_DIR, { recursive: true });

        return files.reduce(function(p, f) {
          return p.then(function() {
            return writeFileFromChunks(f, path.join(STAGING_DIR, restorePathCase(f.path))).then(function(missing) {
              if (missing) incomplete.push(f.path + ' (' + missing + ' of ' + f.children.length + ' chunks missing)');
            });
          });
        }, Promise.resolve());
      }).then(function() {
        fs.rmSync(CONTENT_DIR, { recursive: true, force: true });
        fs.renameSync(STAGING_DIR, CONTENT_DIR);
        incomplete.forEach(function(msg) { console.warn('Incomplete file: ' + msg); });
        var summary = files.length + ' files synced in ' + Math.round((Date.now() - started) / 1000) + 's' +
          (incomplete.length ? ', ' + incomplete.length + ' with missing chunks' : '');
        console.log('Content sync complete: ' + summary);
        return summary;
      });
    }

    // ---------------------------------------------------------------------------
    // Content helpers
    // ---------------------------------------------------------------------------
    function isTextFile(filePath) {
      return TEXT_EXTS.has(path.extname(filePath).toLowerCase());
    }

    // Returns true only for vault content that should be published by Quartz.
    // Filters out LiveSync internals, Obsidian config, and git metadata that
    // LiveSync syncs to CouchDB but have no place in the rendered site.
    function isPublishable(docPath) {
      // LiveSync prefixes system/hidden paths with "i:" in the path field
      if (docPath.startsWith('i:')) return false;
      // LiveSync version sentinel document
      if (docPath === 'obsydian_livesync_version') return false;
      // Hidden directories (.obsidian, .git, etc.) without i: prefix
      var firstSegment = docPath.split('/')[0];
      if (firstSegment.startsWith('.')) return false;
      return true;
    }

    // Text files: join chunk data strings directly (plain text, no padding issue).
    function reconstructTextData(pathDoc, byId) {
      return (pathDoc.children || []).map(function(id) {
        var child = byId[id];
        return child ? (child.data || '') : '';
      }).join('');
    }

    // Binary files: each chunk is independently base64-encoded with padding.
    // Joining the base64 strings causes Buffer.from() to stop at the first
    // padding character, truncating the file after 1 chunk (~100KB).
    // Fix: decode each chunk individually and concatenate the raw Buffers.
    function reconstructBinaryData(pathDoc, byId) {
      var buffers = (pathDoc.children || []).map(function(id) {
        var child = byId[id];
        if (!child) { console.warn('Missing chunk ' + id + ' for ' + pathDoc.path); return Buffer.alloc(0); }
        return Buffer.from(child.data || '', 'base64');
      });
      return Buffer.concat(buffers);
    }

    // LiveSync normalises paths to lowercase in newer versions (APFS compat).
    // Restore title-case for display: "locations/the sulking beholder.md"
    // → "Locations/The Sulking Beholder.md".  Each slash-delimited segment is
    // word-capitalised; the file extension is kept lowercase.
    // Exceptions map handles acronyms/abbreviations that must not be title-cased.
    // 'index' is kept lowercase because Quartz treats index.md as a special root
    // page and generates index.html — renaming it breaks directory resolution.
    var PATH_EXCEPTIONS = { 'npcs': 'NPCs', 'pcs': 'PCs', 'index': 'index' };

    function restorePathCase(docPath) {
      var segments = docPath.split('/');
      return segments.map(function(seg, i) {
        var isFile = i === segments.length - 1;
        if (isFile) {
          var dot = seg.lastIndexOf('.');
          var name = dot > -1 ? seg.slice(0, dot) : seg;
          var ext  = dot > -1 ? seg.slice(dot).toLowerCase() : '';
          var lower = name.toLowerCase();
          if (PATH_EXCEPTIONS[lower]) return PATH_EXCEPTIONS[lower] + ext;
          return name.replace(/(?:^|\s|-)\S/g, function(c) { return c.toUpperCase(); }) + ext;
        }
        var lower = seg.toLowerCase();
        if (PATH_EXCEPTIONS[lower]) return PATH_EXCEPTIONS[lower];
        return seg.replace(/(?:^|\s|-)\S/g, function(c) { return c.toUpperCase(); });
      }).join('/');
    }

    // ---------------------------------------------------------------------------
    // Sync + build job
    // ---------------------------------------------------------------------------
    var DEBOUNCE_MS    = 5000;
    var RETRY_DELAY_MS = 60000;

    function requestSync(reason, delayMs) {
      if (jobRunning) {
        if (!jobQueued) console.log('Sync requested (' + reason + ') while a job is running, queued.');
        jobQueued = true;
        return;
      }
      console.log('Sync requested (' + reason + ').');
      if (jobTimer) clearTimeout(jobTimer);
      jobTimer = setTimeout(runJob, delayMs);
    }

    function runBuild() {
      return new Promise(function(resolve, reject) {
        var proc = spawn('npx', ['quartz', 'build', '--output', SITE_DIR], { cwd: REPO_DIR, stdio: 'inherit' });
        proc.on('close', function(code) {
          if (code === 0) resolve();
          else reject(new Error('Quartz build exited with code ' + code));
        });
        proc.on('error', reject);
      });
    }

    function runJob() {
      jobTimer = null;
      jobRunning = true;
      jobQueued = false;
      phase = 'syncing';
      var failed = false;

      syncVault().then(function(summary) {
        phase = 'building';
        console.log('Building Quartz site...');
        return runBuild().then(function() {
          isReady = true;
          lastResult = 'Succeeded ' + new Date().toLocaleString('en-GB') + ': ' + summary + '.';
          console.log('Build complete.');
        });
      }).catch(function(err) {
        failed = true;
        lastResult = 'Failed ' + new Date().toLocaleString('en-GB') + ': ' + err.message;
        console.error('Sync/build failed: ' + err.message);
      }).then(function() {
        jobRunning = false;
        phase = 'idle';
        if (jobQueued) requestSync('changes during previous job', DEBOUNCE_MS);
        else if (failed) requestSync('retry after failure', RETRY_DELAY_MS);
      });
    }

    // ---------------------------------------------------------------------------
    // Bootstrap Quartz project on first start
    // ---------------------------------------------------------------------------
    function bootstrap() {
      if (fs.existsSync(path.join(REPO_DIR, 'package.json'))) {
        console.log('Quartz project already present, skipping bootstrap.');
        return;
      }
      // Clone to a temp dir so we never try to remove ConfigMap-mounted files
      // (quartz.config.ts / quartz.layout.ts are bind-mounted into REPO_DIR via
      // subPath and cannot be unlinked). After cloning, copy files into REPO_DIR
      // with no-clobber semantics — existing ConfigMap files are preserved as-is.
      var TEMP_DIR = '/tmp/quartz-bootstrap';
      if (fs.existsSync(TEMP_DIR)) fs.rmSync(TEMP_DIR, { recursive: true, force: true });

      console.log('Bootstrapping Quartz from GitHub (first start only)...');
      execSync('git clone --depth=1 ' + QUARTZ_REPO + ' ' + TEMP_DIR, { stdio: 'inherit', timeout: 180000 });

      function copyNoClobber(src, dst) {
        fs.mkdirSync(dst, { recursive: true });
        fs.readdirSync(src, { withFileTypes: true }).forEach(function(entry) {
          var s = path.join(src, entry.name), d = path.join(dst, entry.name);
          if (entry.isDirectory()) { copyNoClobber(s, d); }
          else if (!fs.existsSync(d)) { fs.copyFileSync(s, d); }
        });
      }
      copyNoClobber(TEMP_DIR, REPO_DIR);
      fs.rmSync(TEMP_DIR, { recursive: true, force: true });

      execSync('npm ci', { cwd: REPO_DIR, stdio: 'inherit', timeout: 360000 });
      fs.rmSync(CONTENT_DIR, { recursive: true, force: true });
      fs.mkdirSync(CONTENT_DIR);
      console.log('Bootstrap complete.');
    }

    // ---------------------------------------------------------------------------
    // Patch folderPage.tsx to recognise the Obsidian Folder Notes convention:
    // a file named FolderName/FolderName.md (slugified: folder/folder-name)
    // should be treated as the folder's index page. This runs on every startup
    // so it applies even when bootstrap is skipped (Quartz already on PVC).
    // ---------------------------------------------------------------------------
    function patchFolderPage() {
      var folderPagePath = path.join(REPO_DIR, 'quartz/plugins/emitters/folderPage.tsx');
      if (!fs.existsSync(folderPagePath)) {
        console.warn('[patch] folderPage.tsx not found, skipping patch.');
        return;
      }
      var src = fs.readFileSync(folderPagePath, 'utf8');
      if (src.includes('Obsidian Folder Notes convention')) {
        console.log('[patch] folderPage.tsx already patched, skipping.');
        return;
      }
      var patched = src.replace(
        'if (folders.has(slug)) {\n      folderInfo[slug] = [tree, file]\n    }',
        'if (folders.has(slug)) {\n      folderInfo[slug] = [tree, file]\n    } else {\n      // Obsidian Folder Notes convention: FolderName/FolderName.md\n      const parentFolder = stripSlashes(path.dirname(file.data.slug!)) as SimpleSlug\n      const baseName = path.basename(file.data.slug!)\n      if (folders.has(parentFolder) && baseName === path.basename(parentFolder as string)) {\n        folderInfo[parentFolder] = [tree, file]\n      }\n    }'
      );
      if (patched === src) {
        console.warn('[patch] WARNING: folderPage.tsx patch did not apply — upstream pattern changed. Folder notes will fall back to auto-generated listings.');
      } else {
        fs.writeFileSync(folderPagePath, patched, 'utf8');
        console.log('[patch] folderPage.tsx patched for Obsidian Folder Notes support.');
      }
    }

    // ---------------------------------------------------------------------------
    // Health server (always responds, even during bootstrap)
    // GET  /rebuild — status page with a rebuild button.
    // POST /rebuild — queues a full re-sync + build and redirects to the status
    //   page straight away. Safe to press repeatedly: requests made while a job
    //   is running collapse into one follow-up job.
    //   Invoke (no curl in image — use node):
    //     kubectl exec -n quartz deploy/quartz-webhook -- node -e \
    //       "require('http').request({hostname:'localhost',port:9000,path:'/rebuild',method:'POST'},r=>r.resume()).end()"
    // ---------------------------------------------------------------------------
    function escapeHtml(s) {
      return String(s).replace(/[&<>"]/g, function(c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }

    function statusPage() {
      var busy = jobRunning || jobTimer !== null || phase === 'starting';
      var status = phase === 'syncing'  ? 'Syncing from CouchDB...' :
                   phase === 'building' ? 'Building site...' :
                   phase === 'starting' ? 'Starting up...' :
                   jobTimer !== null    ? 'Sync starting...' : 'Idle';
      if (jobQueued) status += ' (another sync queued)';
      var statusColour = busy ? '#f59e0b' : (isReady ? '#10b981' : '#6b7280');
      return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Quartz Rebuild</title>' +
        (busy ? '<meta http-equiv="refresh" content="5">' : '') +
        '<style>body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}' +
        '.card{background:#1e293b;border-radius:12px;padding:2rem 2.5rem;max-width:400px;width:100%;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.4)}' +
        'h1{font-size:1.25rem;margin:0 0 .5rem}p{color:#94a3b8;font-size:.875rem;margin:.25rem 0}' +
        '.status{display:inline-block;padding:.25rem .75rem;border-radius:999px;font-size:.75rem;font-weight:600;background:' + statusColour + '33;color:' + statusColour + ';margin:.75rem 0 .5rem}' +
        '.last{margin:0 0 1.5rem;word-break:break-word}' +
        'button{background:#6366f1;color:#fff;border:none;border-radius:8px;padding:.75rem 2rem;font-size:1rem;font-weight:600;cursor:pointer;width:100%;transition:background .2s}' +
        'button:hover{background:#4f46e5}</style></head>' +
        '<body><div class="card"><h1>Quartz Rebuild</h1><p>Fall &amp; Rise Digital Garden</p>' +
        '<div class="status">' + escapeHtml(status) + '</div>' +
        '<p class="last">Last run: ' + escapeHtml(lastResult) + '</p>' +
        '<form method="POST" action="/rebuild"><button type="submit">&#9654; Trigger Full Rebuild</button></form></div></body></html>';
    }

    http.createServer(function(req, res) {
      if (req.url === '/healthz') { res.writeHead(200); res.end('ok'); return; }
      if (req.url === '/readyz')  { res.writeHead(isReady ? 200 : 503); res.end(isReady ? 'ready' : 'initializing'); return; }
      if (req.url === '/rebuild' && req.method === 'GET') {
        res.writeHead(200, { 'Content-Type': 'text/html; charset=utf-8' });
        res.end(statusPage());
        return;
      }
      if (req.url === '/rebuild' && req.method === 'POST') {
        if (phase === 'starting') { res.writeHead(303, { Location: '/rebuild' }); res.end(); return; }
        requestSync('manual /rebuild', 0);
        // 303 so refreshing the status page does not resubmit the form.
        res.writeHead(303, { Location: '/rebuild' });
        res.end();
        return;
      }
      res.writeHead(404); res.end();
    }).listen(HEALTH_PORT, function() { console.log('Health server on :' + HEALTH_PORT); });

    // ---------------------------------------------------------------------------
    // Main
    // ---------------------------------------------------------------------------
    function watchLoop(since) {
      watchChanges(since).then(function(result) {
        var count = (result.results || []).length;
        if (count > 0) requestSync(count + ' CouchDB change(s)', DEBOUNCE_MS);
        return result.last_seq || since;
      }).then(function(nextSeq) {
        setImmediate(function() { watchLoop(nextSeq); });
      }).catch(function(err) {
        console.error('Changes feed error:', err.message, '- retrying in 10s');
        setTimeout(function() { watchLoop(since); }, 10000);
      });
    }

    getDbInfo().then(function(info) {
      // Capture seq BEFORE the initial sync so concurrent changes are not missed
      var since = info.update_seq;

      bootstrap();
      patchFolderPage();

      phase = 'idle';
      requestSync('startup', 0);
      console.log('Watching CouchDB _changes for ' + COUCHDB_DATABASE + '...');
      watchLoop(since);
    }).catch(function(err) {
      console.error('Fatal startup error:', err.message);
      process.exit(1);
    });
  entrypoint.sh: |
    #!/bin/sh
    set -e
    apt-get update -qq && apt-get install -y --no-install-recommends git ca-certificates && rm -rf /var/lib/apt/lists/*
    exec node /config/server.js
