# Operational alerting. Git-managed: edit here, not in the HA UI.
alerting_package:
  automation:
    # Receives VMAlertmanager webhooks (kubernetes/applications/monitoring/
    # templates/vmalertmanager.yaml). The webhook ID must match the URL in the
    # monitoring/alertmanager-ha-webhook secret.
    - id: alerting_kubernetes_alertmanager
      alias: Alerting — Kubernetes Alertmanager
      description: Relay Alertmanager alerts to persistent notifications, and
        warning/critical alerts to Hugh's phone. Resolved alerts clear both.
      mode: queued
      max: 20
      triggers:
        - trigger: webhook
          webhook_id: alertmanager-k8s
          allowed_methods: [POST]
          local_only: true
      actions:
        - repeat:
            # Watchdog / InfoInhibitor are heartbeat alerts that always fire.
            for_each: >-
              {{ trigger.json.alerts | default([])
                 | rejectattr('labels.alertname', 'in', ['Watchdog', 'InfoInhibitor'])
                 | list }}
            sequence:
              - variables:
                  name: "{{ repeat.item.labels.alertname }}"
                  severity: "{{ repeat.item.labels.severity | default('none') }}"
                  firing: "{{ repeat.item.status == 'firing' }}"
                  summary: >-
                    {{ repeat.item.annotations.summary
                       | default(repeat.item.annotations.description | default(name)) }}
                  nid: >-
                    k8s_{{ name }}_{{ repeat.item.labels.namespace | default('cluster') }}
              - if: "{{ firing }}"
                then:
                  - action: persistent_notification.create
                    data:
                      notification_id: "{{ nid }}"
                      title: "[{{ severity }}] {{ name }}"
                      message: "{{ summary }}"
                  - if: "{{ severity in ['critical', 'warning'] }}"
                    then:
                      - action: notify.mobile_app_hugh_mobile
                        data:
                          title: "K8s {{ severity }}: {{ name }}"
                          message: "{{ summary }}"
                          data:
                            tag: "{{ nid }}"
                else:
                  - action: persistent_notification.dismiss
                    data:
                      notification_id: "{{ nid }}"
                  - action: notify.mobile_app_hugh_mobile
                    data:
                      message: clear_notification
                      data:
                        tag: "{{ nid }}"

    - id: health_critical_connectivity
      alias: Health — Critical Connectivity Alert
      description: Alert when a critical automation dependency or UniFi
        infrastructure device stays unhealthy for 5 minutes.
      mode: queued
      max: 10
      triggers:
        - trigger: state
          entity_id:
            - binary_sensor.zigbee2mqtt_bridge_connection_state
            - sensor.wiser_cloud
            - sensor.cloud_gateway_ultra_state
            - sensor.marie_s_office_access_point_state
            - sensor.usw_lite_8_poe_state
            - sensor.u6_mesh_state
          for: "00:05:00"
      conditions:
        - condition: template
          value_template: >-
            {% set ok = {'binary_sensor.zigbee2mqtt_bridge_connection_state': 'on',
                         'sensor.wiser_cloud': 'Connected'} %}
            {{ trigger.to_state.state != ok.get(trigger.entity_id, 'connected') }}
      actions:
        - action: persistent_notification.create
          data:
            title: Critical Connectivity Issue
            message: "{{ trigger.to_state.name }} changed to {{ trigger.to_state.state }}."
            notification_id: "critical_connectivity_{{ trigger.entity_id | replace('.', '_') }}"
        - action: notify.mobile_app_hugh_mobile
          data:
            title: Homelab connectivity issue
            message: "{{ trigger.to_state.name }} changed to {{ trigger.to_state.state }}."

    - id: health_unifi_telemetry
      alias: Health — UniFi Telemetry Alert
      description: Alert when key UniFi infrastructure telemetry stays above safe
        operating thresholds for 10 minutes.
      mode: queued
      max: 10
      triggers:
        - trigger: numeric_state
          entity_id:
            - sensor.cloud_gateway_ultra_cpu_utilization
            - sensor.cloud_gateway_ultra_memory_utilization
            - sensor.marie_s_office_access_point_cpu_utilization
            - sensor.marie_s_office_access_point_memory_utilization
            - sensor.usw_lite_8_poe_cpu_utilization
            - sensor.usw_lite_8_poe_memory_utilization
            - sensor.u6_mesh_cpu_utilization
            - sensor.u6_mesh_memory_utilization
          above: 85
          for: "00:10:00"
      actions:
        - variables:
            message: >-
              {{ trigger.to_state.name }} has been at
              {{ trigger.to_state.state }}{{ trigger.to_state.attributes.unit_of_measurement | default('') }}
              for 10 minutes.
        - action: persistent_notification.create
          data:
            title: UniFi Telemetry Alert
            message: "{{ message }}"
            notification_id: "unifi_telemetry_{{ trigger.entity_id | replace('.', '_') }}"
        - action: notify.mobile_app_hugh_mobile
          data:
            title: UniFi telemetry alert
            message: "{{ message }}"

    - id: health_low_battery_digest
      alias: Health — Low Battery Digest
      description: Daily summary of device batteries below 20% (phones and
        tablets excluded).
      mode: single
      triggers:
        - trigger: time
          at: "09:00:00"
      variables:
        # Phones/tablets report *_battery_level and are excluded.
        low: >-
          {%- set ns = namespace(items=[]) -%}
          {%- for s in states.sensor
               | selectattr('attributes.device_class', 'defined')
               | selectattr('attributes.device_class', 'eq', 'battery') -%}
            {%- if s.state | is_number and s.state | float < 20
                   and not s.entity_id.endswith('_battery_level') -%}
              {%- set ns.items = ns.items + [s.name ~ ' (' ~ (s.state | float | round(0) | int) ~ '%)'] -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.items }}
      conditions:
        - condition: template
          value_template: "{{ low | count > 0 }}"
      actions:
        - action: persistent_notification.create
          data:
            notification_id: low_battery_digest
            title: Low batteries
            message: "{{ low | join('\n') }}"
        - action: notify.mobile_app_hugh_mobile
          data:
            title: "{{ low | count }} low batteries"
            message: "{{ low | join(', ') }}"

    - id: health_backup_stale
      alias: Health — Backup Stale
      description: Alert when no automatic backup has succeeded in 36 hours.
      mode: single
      triggers:
        - trigger: time
          at: "09:05:00"
      conditions:
        - condition: template
          value_template: >-
            {% set last = states('sensor.backup_last_successful_automatic_backup') %}
            {{ last in ['unknown', 'unavailable']
               or now() - as_datetime(last) > timedelta(hours=36) }}
      actions:
        - action: persistent_notification.create
          data:
            notification_id: backup_stale
            title: Home Assistant backup stale
            message: >-
              Last successful automatic backup:
              {{ states('sensor.backup_last_successful_automatic_backup') }}
        - action: notify.mobile_app_hugh_mobile
          data:
            title: Home Assistant backup stale
            message: >-
              Last successful automatic backup:
              {{ states('sensor.backup_last_successful_automatic_backup') }}
