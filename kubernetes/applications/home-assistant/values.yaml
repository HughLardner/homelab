# Home Assistant Helm Chart Configuration
# Chart: https://github.com/pajikos/home-assistant-helm-chart

# Global values (replicated from config/homelab.yaml to avoid ArgoCD multi-source
# same-repo revision race conditions with $values refs)
global:
  domain: silverseekers.org
  cert_issuer: letsencrypt-prod

# Authelia forward auth protection
# Disabled when using OIDC authentication (SSO login directly to HA)
auth_enabled: false

# HACS Setup Job
# Automatically installs HACS after deployment via post-install hook
# Adapted from: https://github.com/small-hack/home-assistant-chart
# Only enable for fresh installs; disable once setup is complete to avoid
# ArgoCD sync loops (hooks re-trigger on every sync and can't schedule on
# resource-constrained nodes).
setupHacs:
  enabled: false

# Owner User Creation
# Automatically creates the initial admin user during first deployment
# This skips the manual onboarding process
# Adapted from: https://github.com/small-hack/home-assistant-chart
# Only enable for fresh installs; disable once onboarding is complete.
owner:
  create: false
  # Use existing secret for credentials (created via sealed-secrets)
  existingSecret: home-assistant-owner-credentials
  # Enable debug output (WARNING: reveals sensitive data in logs)
  debug: false

# Home Assistant subchart configuration
# priorityClassName is set at the subchart level
priorityClassName: homelab-standard

homeassistant:
  # Override fullname to avoid ugly duplication in resource names
  # Without this, PVC becomes: home-assistant-homeassistant-home-assistant-homeassistant-0
  # With this, PVC becomes: home-assistant-home-assistant-0
  fullnameOverride: home-assistant

  # Controller type - StatefulSet for persistent storage
  controller:
    type: StatefulSet

  # Image configuration
  image:
    repository: ghcr.io/home-assistant/home-assistant
    # Upgrading from 2026.3.3 in two steps (2026.6.x, then 2026.9.x) to stay
    # inside HA's deprecation windows.
    tag: "2026.6.4"
    pullPolicy: IfNotPresent

  # Service configuration
  # Note: Homepage annotations are on the IngressRoute, not here
  # (Homepage uses traefik: true for discovery via IngressRoutes)
  service:
    type: ClusterIP
    port: 8123

  # Disable built-in ingress - we use Traefik IngressRoute
  ingress:
    enabled: false

  # Persistent storage
  persistence:
    enabled: true
    size: 10Gi
    storageClass: longhorn
    accessMode: ReadWriteOnce

  # Resource limits
  # Memory raised from 1Gi → 2Gi: HA was using ~1.4 GB working set, exceeding its own limit.
  # Request matches steady-state usage (~1 GiB) so the scheduler/evictor see the real footprint.
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: "1"       # Use "1" not "1000m" to avoid ArgoCD out-of-sync due to k8s normalization
      memory: 2Gi

  # Environment variables for OIDC configuration
  # These are read by the hass-oidc-auth integration
  env:
    - name: OIDC_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: home-assistant-oidc-secret
          key: client-id
    - name: OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: home-assistant-oidc-secret
          key: client-secret

  # Home Assistant configuration
  configuration:
    # Disabled because the upstream chart's built-in setup-config init container
    # does not support resources, and namespace ResourceQuota requires requests
    # and limits for every container (including init containers).
    # Keep false unless the chart adds init-container resources support.
    enabled: false
    # While disabled, the live /config/configuration.yaml is hand-maintained
    # and nothing below is applied. templateConfig is kept as the reference
    # baseline for rebuilds: the live file must at least contain the
    # `homeassistant: packages:` include so the Git-managed packages load.
    # Everything new should go in packages/*.yaml, not here.
    # forceInit=true would re-run the yq merge on every restart; keep false.
    forceInit: false
    # Trust Traefik proxy and cluster network
    trusted_proxies:
      - 10.42.0.0/16    # K3s pod CIDR
      - 10.43.0.0/16    # K3s service CIDR
      - 192.168.10.0/24 # Local network
    templateConfig: |-
      # Loads default set of integrations. Do not remove.
      default_config:

      http:
        use_x_forwarded_for: true
        trusted_proxies:
          {{- range .Values.configuration.trusted_proxies }}
          - {{ . }}
          {{- end }}

      # Load frontend themes from the themes folder
      frontend:
        themes: !include_dir_merge_named themes

      automation: !include automations.yaml
      script: !include scripts.yaml
      scene: !include scenes.yaml

      auth_oidc:
        client_id: home-assistant
        client_secret: !env_var OIDC_CLIENT_SECRET
        discovery_url: https://auth.silverseekers.org/.well-known/openid-configuration
        display_name: "Authelia"
        features:
          force_https: true
          automatic_user_linking: true

      homeassistant:
        # Set the real home coordinates so companion-app GPS presence resolves
        # against the actual house instead of a broken default Home zone.
        latitude: 53.3937271
        longitude: -6.4469057
        # Load all YAML files in /config/packages/ as configuration packages.
        # This lets us add shell_command, input_button, automations etc. via
        # ConfigMaps without touching this file again.
        packages: !include_dir_merge_named packages

  # Git-managed HA packages (packages/*.yaml → templates/packages-configmap.yaml),
  # mounted as a directory so ConfigMap updates appear without a restart.
  # pajikos chart exposes additionalVolumes / additionalMounts (not extraVolumes).
  additionalVolumes:
    - name: ha-packages
      configMap:
        name: ha-packages

  additionalMounts:
    - name: ha-packages
      mountPath: /config/packages
      readOnly: true

  # Probes: the chart reads livenessProbe/readinessProbe/startupProbe (an
  # earlier `probes:` block here was silently ignored). The startup probe
  # allows up to 10 min for a slow start (large recorder DB, loaded node)
  # before liveness takes over.
  startupProbe:
    httpGet:
      path: /
      port: http
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 40
  livenessProbe:
    httpGet:
      path: /
      port: http
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 5
  readinessProbe:
    httpGet:
      path: /
      port: http
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  # Home Assistant's Thread integration needs direct LAN visibility for OTBR
  # border-agent discovery; REST access alone is not enough.
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
