views:
  - title: Home
    path: default_view
    type: sections
    icon: mdi:home
    # max_columns:2 means phones get 1 col, tablets in portrait get 2.
    # Sections use column_span to force full-width rows where needed.
    max_columns: 2
    sections:
      # =======================================================
      # Pop-ups: one vertical-stack per pop-up (invisible until
      # hash activated). Kept identical to the (wide) dashboard so
      # chips/tiles can trigger the same overlays.
      # =======================================================
      - type: grid
        column_span: 2
        cards:
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: "#scenes"
                name: Scenes
                icon: mdi:palette
                bg_color: var(--primary-background-color)
              - type: custom:mushroom-chips-card
                chips:
                  - type: action
                    icon: mdi:moon-waning-crescent
                    icon_color: indigo
                    content: Bedtime
                    tap_action:
                      action: perform-action
                      perform_action: scene.turn_on
                      target:
                        entity_id: scene.bedroom_lamps_bed_time
                  - type: action
                    icon: mdi:palette
                    icon_color: red
                    content: Office red
                    tap_action:
                      action: perform-action
                      perform_action: scene.turn_on
                      target:
                        entity_id: scene.office_1_red
                  - type: action
                    icon: mdi:palette-outline
                    icon_color: deep-orange
                    content: Office red v2
                    tap_action:
                      action: perform-action
                      perform_action: scene.turn_on
                      target:
                        entity_id: scene.office_2_red2
                  - type: action
                    icon: mdi:test-tube
                    icon_color: cyan
                    content: Office test
                    tap_action:
                      action: perform-action
                      perform_action: scene.turn_on
                      target:
                        entity_id: scene.office_0_test
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: "#automations"
                name: Automations
                icon: mdi:robot
                bg_color: var(--primary-background-color)
              - type: custom:auto-entities
                card:
                  type: entities
                  show_header_toggle: false
                  title: All automations
                card_param: entities
                filter:
                  include:
                    - domain: automation
                sort:
                  method: friendly_name
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: "#people"
                name: Presence detail
                icon: mdi:account-multiple
                bg_color: var(--primary-background-color)
              - type: entities
                title: People & phones
                entities:
                  - person.hugh
                  - person.marie
                  - device_tracker.hugh_mobile
                  - device_tracker.hugh_tablet
                  - device_tracker.work_phone
                  - sensor.hugh_mobile_battery_level
                  - sensor.hugh_mobile_battery_state
                  - sensor.hugh_tablet_battery_level
                  - sensor.work_phone_battery_level

      # =======================================================
      # Hero row: status chips (same as wide, full width)
      # =======================================================
      - type: grid
        column_span: 2
        cards:
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                icon: mdi:account-multiple
                icon_color: blue
                content: >-
                  {{ (expand('zone.home')
                      | selectattr('domain','eq','person')
                      | rejectattr('state','in',['unknown','unavailable','away','not_home'])
                      | list | length) }} home
                tap_action:
                  action: navigate
                  navigation_path: "#people"
              - type: template
                icon: mdi:lightbulb-on
                icon_color: amber
                content: >-
                  {{ states.light
                     | rejectattr('state','in',['unknown','unavailable'])
                     | selectattr('state','eq','on')
                     | list | count }} lights
              - type: template
                icon: mdi:fire
                icon_color: orange
                content: >-
                  {{ states.climate
                     | selectattr('attributes.hvac_action','eq','heating')
                     | list | count }} heating
                tap_action:
                  action: navigate
                  navigation_path: /heating-zones
              - type: template
                icon: mdi:door
                icon_color: red
                content: >-
                  {{ (states.binary_sensor
                      | selectattr('attributes.device_class','defined')
                      | selectattr('attributes.device_class','in',['door','opening','window'])
                      | selectattr('state','eq','on')
                      | list | count) }} open
              - type: template
                icon: mdi:transmission-tower
                icon_color: |-
                  {% set g = states('sensor.myenergi_harvi_2239208_grid_ct1') | float(0) %}
                  {% if g < -100 %}green{% elif g > 100 %}red{% else %}grey{% endif %}
                content: >-
                  {% set g = states('sensor.myenergi_harvi_2239208_grid_ct1') | float(0) %}
                  {% if g < 0 %}Export {{ (g * -1) | round(0) }}W
                  {% elif g > 0 %}Import {{ g | round(0) }}W
                  {% else %}Grid idle{% endif %}
                tap_action:
                  action: navigate
                  navigation_path: /energy-ev
              - type: template
                icon: mdi:ev-station
                icon_color: green
                content: >-
                  {{ states('sensor.myenergi_zappi_25608214_status') }}
                tap_action:
                  action: navigate
                  navigation_path: /energy-ev
              - type: template
                icon: mdi:battery-alert-variant-outline
                icon_color: red
                content: >-
                  {{ states.sensor
                     | selectattr('attributes.device_class','defined')
                     | selectattr('attributes.device_class','eq','battery')
                     | rejectattr('state','in',['unknown','unavailable'])
                     | selectattr('state','lt','25')
                     | list | count }} low
                tap_action:
                  action: navigate
                  navigation_path: /entity-health
              - type: template
                icon: mdi:package-up
                icon_color: orange
                content: >-
                  {{ states.update | selectattr('state','eq','on') | list | count }} updates
                tap_action:
                  action: navigate
                  navigation_path: /system-maintenance
              - type: entity
                entity: switch.wiser_away_mode
                icon: mdi:airplane
                icon_color: deep-orange
                content_info: state
              - type: entity
                entity: switch.wiser_eco_mode
                icon: mdi:leaf
                icon_color: green
                content_info: state
              - type: template
                icon: mdi:script-text-play
                icon_color: purple
                content: Scenes
                tap_action:
                  action: navigate
                  navigation_path: "#scenes"
              - type: template
                icon: mdi:robot
                icon_color: teal
                content: Automations
                tap_action:
                  action: navigate
                  navigation_path: "#automations"

      # =======================================================
      # Weather (1 col on tablet / full on phone)
      # =======================================================
      - title: Weather
        cards:
          - type: custom:simple-weather-card
            entity: weather.home
            backdrop:
              day: "#1e3c72"
              night: "#0f1e3c"
          - type: weather-forecast
            entity: weather.home
            forecast_type: daily
            show_current: false
            show_forecast: true

      # =======================================================
      # Presence & devices
      # =======================================================
      - title: Presence & devices
        cards:
          - type: custom:stack-in-card
            cards:
              - type: custom:mushroom-person-card
                entity: person.hugh
                primary_info: name
                secondary_info: state
                icon_type: entity-picture
              - type: custom:mushroom-person-card
                entity: person.marie
                primary_info: name
                secondary_info: state
                icon_type: entity-picture
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: entity
                entity: sensor.hugh_mobile_battery_level
                icon: mdi:cellphone
                content_info: state
              - type: conditional
                conditions:
                  - entity: sensor.work_phone_battery_level
                    state_not: unknown
                  - entity: sensor.work_phone_battery_level
                    state_not: unavailable
                chip:
                  type: entity
                  entity: sensor.work_phone_battery_level
                  icon: mdi:cellphone-wireless
                  content_info: state
              - type: entity
                entity: sensor.hugh_tablet_battery_level
                icon: mdi:tablet
                content_info: state

      # =======================================================
      # Media playing — auto-hides when nothing active
      # =======================================================
      - title: Media playing
        column_span: 2
        cards:
          - type: custom:auto-entities
            card:
              type: entities
              show_header_toggle: false
            card_param: entities
            filter:
              include:
                - domain: media_player
                  state: playing
                  options:
                    type: custom:mushroom-media-player-card
                    use_media_info: true
                    show_volume_level: true
                    media_controls:
                      - play_pause_stop
                      - previous
                      - next
                    volume_controls:
                      - volume_mute
                      - volume_set
                    fill_container: true
                - domain: media_player
                  state: paused
                  options:
                    type: custom:mushroom-media-player-card
                    use_media_info: true
                    show_volume_level: true
                    media_controls:
                      - play_pause_stop
                    fill_container: true
            show_empty: true

      # =======================================================
      # Room temperatures (2-col grid of 12 tiles)
      # Each tile: mini-graph (temp + 6h sparkline) + chips
      # showing lights X/Y and heating On/Off for that room.
      # Tap navigates to the mobile Rooms dashboard pop-up.
      # =======================================================
      - title: Room temperatures (6h)
        column_span: 2
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              # --- Kitchen ---
              - type: custom:stack-in-card
                keep:
                  background: false
                  box_shadow: false
                  margin: true
                  outer_padding: false
                cards:
                  - type: custom:mini-graph-card
                    name: Kitchen
                    entities:
                      - sensor.wiser_lts_temperature_kitchen_dining_room
                    hours_to_show: 6
                    points_per_hour: 4
                    line_color: orange
                    height: 70
                    show:
                      state: true
                      name: true
                      icon: false
                      labels: false
                    tap_action:
                      action: navigate
                      navigation_path: /rooms-overview/default_view#kitchen
                  - type: custom:mushroom-chips-card
                    alignment: center
                    chips:
                      - type: template
                        icon: mdi:lightbulb
                        icon_color: >-
                          {% set e = states.light | selectattr('entity_id','in', area_entities('kitchen')) | list %}
                          {{ 'amber' if e | selectattr('state','eq','on') | list | count > 0 else 'grey' }}
                        content: >-
                          {% set e = states.light | selectattr('entity_id','in', area_entities('kitchen')) | list %}
                          {{ e | selectattr('state','eq','on') | list | count }}/{{ e | count }}
                      - type: template
                        icon: mdi:fire
                        icon_color: >-
                          {{ 'orange' if state_attr('climate.wiser_kitchen_dining_room','hvac_action') == 'heating' else 'grey' }}
                        content: >-
                          {{ 'On' if state_attr('climate.wiser_kitchen_dining_room','hvac_action') == 'heating' else 'Off' }}

              # --- Sitting (switch-as-light) ---
