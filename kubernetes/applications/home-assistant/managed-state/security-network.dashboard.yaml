views:
  - title: Security & Network
    path: default_view
    type: sections
    icon: mdi:shield-home
    max_columns: 4
    sections:
      # ===========================================================
      # At a glance
      # ===========================================================
      - title: At a glance
        column_span: 4
        cards:
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: entity
                entity: binary_sensor.hall_front_door_sensor_contact
                icon: mdi:door
                icon_color: red
                content_info: state
              - type: template
                icon: mdi:motion-sensor
                icon_color: amber
                content: >-
                  {{ states.binary_sensor
                     | selectattr('entity_id','search','motion|occupancy')
                     | selectattr('state','eq','on')
                     | list | count }} motion
              - type: entity
                entity: person.hugh
                icon: mdi:account
                icon_color: blue
                content_info: state
              - type: entity
                entity: person.marie
                icon: mdi:account-outline
                icon_color: pink
                content_info: state
              - type: entity
                entity: binary_sensor.zigbee2mqtt_bridge_connection_state
                icon: mdi:zigbee
                icon_color: green
                content_info: state
              - type: entity
                entity: binary_sensor.slzb_mr3u_internet
                icon: mdi:web
                icon_color: blue
                content_info: state
              - type: entity
                entity: sensor.wiser_cloud
                icon: mdi:cloud
                icon_color: cyan
                content_info: state
      # ===========================================================
      # Cameras — native picture-entity with camera_view: auto.
      # Shows latest snapshot by default (cheap), HA auto-negotiates
      # an HLS live stream with Nest SDM on tap/hover, and tears it
      # down when the card leaves the viewport. No go2rtc needed.
      # ===========================================================
      - title: Cameras
        column_span: 4
        cards:
          - type: grid
            columns: 3
            square: false
            cards:
              - type: picture-entity
                entity: camera.front_door
                name: Front Door
                camera_view: auto
                show_state: false
              - type: picture-entity
                entity: camera.back_garden
                name: Back Garden
                camera_view: auto
                show_state: false
              - type: picture-entity
                entity: camera.side_gate
                name: Side Gate
                camera_view: auto
                show_state: false
      # ===========================================================
      # People & phones
      # (v3: dropped person.admin — device_trackers reassigned to
      # person.hugh, Marie tracker pending Companion install.)
      # ===========================================================
      - title: People & phones
        column_span: 2
        cards:
          - type: custom:stack-in-card
            cards:
              - type: custom:mushroom-person-card
                entity: person.hugh
                primary_info: name
                secondary_info: state
                icon_type: entity-picture
              - type: custom:mushroom-person-card
                entity: person.marie
                primary_info: name
                secondary_info: state
                icon_type: entity-picture
          - type: entities
            title: Tracked devices
            show_header_toggle: false
            entities:
              - entity: device_tracker.hugh_mobile
                name: Hugh Mobile
              - entity: device_tracker.hugh_tablet
                name: Hugh Tablet
              - entity: device_tracker.work_phone
                name: Work phone
              - entity: sensor.hugh_mobile_battery_level
                name: Hugh Mobile battery
              - entity: sensor.hugh_mobile_battery_state
                name: Hugh Mobile battery state
              - entity: sensor.hugh_tablet_battery_level
                name: Hugh Tablet battery
              - entity: sensor.work_phone_battery_level
                name: Work phone battery
      # ===========================================================
      # Event log (v3: dropped event.front_door_chime which starts
      # `unknown` and rejects into logbook-card until first fire)
      # ===========================================================
      - title: Door & motion events (24h)
        column_span: 2
        cards:
          - type: custom:logbook-card
            title: Security log
            hours_to_show: 24
            collapse: 12
            entities:
              - entity: event.front_door_motion
              - entity: event.back_garden_motion
              - entity: event.side_gate_motion
              - entity: binary_sensor.hall_front_door_sensor_contact
              - entity: binary_sensor.hall_motion_sensor_occupancy
              - entity: binary_sensor.landing_motion_sensor_occupancy
              - entity: binary_sensor.office_motion_sensor_occupancy
              - entity: binary_sensor.myggspray_wrlss_mtn_sensor_occupancy
              - entity: binary_sensor.myggbett_door_window_sensor_door
            show:
              state: true
              duration: true
              icon: true
              separator: true
      # ===========================================================
      # Motion activity chart (v3: apexcharts handles binary state
      # much better than mini-graph-card which was flatlining)
      # ===========================================================
      - title: Motion activity (24h)
        column_span: 4
        cards:
          - type: custom:apexcharts-card
            header:
              show: true
              title: Motion & contact events
              show_states: false
            graph_span: 24h
            span:
              end: minute
            apex_config:
              chart:
                height: 240
                type: line
              stroke:
                width: 2
                curve: stepline
              legend:
                position: bottom
              grid:
                borderColor: rgba(255,255,255,0.08)
              yaxis:
                - min: 0
                  max: 1
                  tickAmount: 1
            all_series_config:
              transform: "return x === 'on' ? 1 : 0;"
              type: area
            series:
              - entity: binary_sensor.hall_motion_sensor_occupancy
                name: Hall
              - entity: binary_sensor.landing_motion_sensor_occupancy
                name: Landing
              - entity: binary_sensor.office_motion_sensor_occupancy
                name: Office
              - entity: binary_sensor.myggspray_wrlss_mtn_sensor_occupancy
                name: Aux
              - entity: binary_sensor.hall_front_door_sensor_contact
                name: Front door
      # ===========================================================
      # Doors & motion + Security automations (side by side)
      # ===========================================================
      - title: Doors & motion
        column_span: 2
        cards:
          - type: entities
            show_header_toggle: false
            entities:
              - type: section
                label: Contacts
              - entity: binary_sensor.hall_front_door_sensor_contact
                name: Hall front door
              - entity: binary_sensor.myggbett_door_window_sensor_door
                name: Aux door/window
              - type: section
                label: Motion
              - entity: binary_sensor.hall_motion_sensor_occupancy
                name: Hall motion
              - entity: binary_sensor.landing_motion_sensor_occupancy
                name: Landing motion
              - entity: binary_sensor.office_motion_sensor_occupancy
                name: Office motion
              - entity: binary_sensor.myggspray_wrlss_mtn_sensor_occupancy
                name: Aux motion
      - title: Security automations
        column_span: 2
        cards:
          - type: entities
            show_header_toggle: false
            title: Door / night alerts
            entities:
              - entity: automation.hall_front_door_opened_turn_on_light
                name: Front door → light on
              - entity: automation.hall_front_door_opened_night_alert
                name: Front door → night alert
              - entity: automation.hall_lights_on_motion_night
                name: Hall lights on motion (night)
              - entity: automation.hall_lights_off_no_motion_2_min
                name: Hall lights off (2 min no motion)
