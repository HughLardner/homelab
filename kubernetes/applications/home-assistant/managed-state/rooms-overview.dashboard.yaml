streamline_templates:
  # Room tile: mushroom-template-card with vertical layout so long names
  # never truncate on mobile.
  room_tile:
    default:
      primary: Room
      secondary: ""
      icon: mdi:home
      color: blue
      hash: ""
    card:
      type: custom:mushroom-template-card
      primary: "[[primary]]"
      secondary: "[[secondary]]"
      icon: "[[icon]]"
      icon_color: "[[color]]"
      fill_container: true
      layout: vertical
      tap_action:
        action: navigate
        navigation_path: "[[hash]]"
views:
  - title: Rooms
    path: default_view
    type: sections
    icon: mdi:floor-plan
    max_columns: 4
    sections:
      # =======================================================
      # v3 pop-up fix: ONE vertical-stack per pop-up, all of
      # them siblings inside a single grid section. This is
      # the bubble-card documented pattern and fixes the v2
      # bug where the first pop-up grabbed every subsequent
      # card in the shared stack.
      # =======================================================
      - type: grid
        column_span: 4
        cards:
          # ---- Kitchen / Dining ----
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: "#kitchen"
                name: Kitchen / Dining
                icon: mdi:silverware-fork-knife
              - type: custom:mushroom-climate-card
                entity: climate.wiser_kitchen_dining_room
                name: Kitchen
                hvac_modes:
                  - "off"
                  - heat
                  - auto
                show_temperature_control: true
                fill_container: true
              - type: entities
                title: Lights
                show_header_toggle: false
                entities:
                  - light.kitchen_cabinet
                  - light.kitchen_spot_1
                  - light.kitchen_spot_2
                  - light.kitchen_spot_3
                  - light.kitchen_spot_4
              - type: entities
                title: Environment
                show_header_toggle: false
                entities:
                  - sensor.wiser_lts_temperature_kitchen_dining_room
              - type: custom:mushroom-media-player-card
                entity: media_player.kitchen
                use_media_info: true
                show_volume_level: true
                fill_container: true
          # ---- Sitting Room ----
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: "#sitting_room"
                name: Sitting Room
                icon: mdi:sofa
              - type: custom:mushroom-climate-card
                entity: climate.wiser_sitting_room
                name: Sitting Room
                hvac_modes:
                  - "off"
                  - heat
                  - auto
                fill_container: true
              - type: entities
                title: Switches
                show_header_toggle: false
                entities:
                  - switch.sitting_room_lamp
              - type: entities
                title: Environment
                show_header_toggle: false
                entities:
                  - sensor.wiser_lts_temperature_sitting_room
                  - sensor.wiser_lts_humidity_sitting_room
              - type: custom:mushroom-media-player-card
                entity: media_player.living_room
                use_media_info: true
                show_volume_level: true
                fill_container: true
          # ---- Hall ----
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: "#hall"
                name: Hall
                icon: mdi:door-open
              - type: entities
                title: Lights
                show_header_toggle: false
                entities:
                  - light.hall
                  - light.hall_light_kitchen
                  - light.hall_light_door
              - type: entities
                title: Doors & motion
                show_header_toggle: false
                entities:
                  - binary_sensor.hall_front_door_sensor_contact
                  - binary_sensor.hall_motion_sensor_occupancy
                  - sensor.hall_motion_sensor_temperature
                  - sensor.hall_motion_sensor_illuminance
          # ---- Marie's Office ----
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: "#marie_office"
                name: Marie's Office
                icon: mdi:desk
              - type: custom:mushroom-climate-card
                entity: climate.wiser_marie_s_office
                name: Marie's Office
                hvac_modes:
                  - "off"
                  - heat
                  - auto
                fill_container: true
              - type: entities
                title: Environment
                show_header_toggle: false
                entities:
                  - sensor.wiser_lts_temperature_marie_s_office
          # ---- Outside / Garden (cameras) ----
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: "#outside"
                name: Outside / Garden
                icon: mdi:leaf
              - type: weather-forecast
                entity: weather.home
                forecast_type: daily
              - type: picture-entity
                entity: camera.front_door
                name: Front Door
                camera_view: auto
                show_state: false
              - type: picture-entity
                entity: camera.back_garden
                name: Back Garden
                camera_view: auto
                show_state: false
              - type: picture-entity
                entity: camera.side_gate
                name: Side Gate
                camera_view: auto
                show_state: false
          # ---- Bedroom ----
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: "#bedroom"
                name: Bedroom
                icon: mdi:bed-queen
              - type: custom:mushroom-climate-card
                entity: climate.wiser_bedroom
                name: Bedroom
                hvac_modes:
                  - "off"
                  - heat
                  - auto
                fill_container: true
              - type: entities
                title: Lights & scenes
                show_header_toggle: false
                entities:
                  - light.bedroom_lamps
                  - light.marie_lamp
                  - light.hugh_s_lamp
                  - scene.bedroom_lamps_0_bed_time
              - type: entities
                title: Environment
                show_header_toggle: false
                entities:
                  - sensor.wiser_lts_temperature_bedroom
                  - sensor.wiser_lts_humidity_bedroom
          # ---- Landing ----
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: "#landing"
                name: Landing
                icon: mdi:stairs
              - type: entities
                title: Landing
                show_header_toggle: false
                entities:
                  - light.landing_light
                  - binary_sensor.landing_motion_sensor_occupancy
                  - sensor.landing_motion_sensor_temperature
                  - sensor.landing_motion_sensor_illuminance
          # ---- Hugh's Office ----
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: "#office"
                name: Office (Hugh's)
                icon: mdi:monitor-dashboard
              - type: custom:mushroom-climate-card
                entity: climate.wiser_hugh_s_office
                name: Hugh's Office
                hvac_modes:
                  - "off"
                  - heat
                  - auto
                fill_container: true
              - type: entities
                title: Lights & scenes
                show_header_toggle: false
                entities:
                  - light.office
                  - light.office_light
                  - light.office_cabinet
                  - light.office_bar_right
                  - light.office_bar_left
                  - scene.office_0_test
                  - scene.office_1_red
                  - scene.office_2_red2
              - type: entities
                title: Environment
                show_header_toggle: false
                entities:
                  - sensor.wiser_lts_temperature_hugh_s_office
                  - sensor.office_motion_sensor_temperature
                  - binary_sensor.office_motion_sensor_occupancy
                  - sensor.office_motion_sensor_illuminance
          # ---- Lily's Room ----
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: "#lily_room"
                name: Lily's Room
                icon: mdi:bed-single
              - type: custom:mushroom-climate-card
                entity: climate.wiser_lily_s_room
                name: Lily's Room
                hvac_modes:
                  - "off"
                  - heat
                  - auto
                fill_container: true
              - type: entities
                title: Environment
                show_header_toggle: false
                entities:
                  - sensor.wiser_lts_temperature_lily_s_room
          # ---- Alex's Room ----
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: "#alex_room"
                name: Alex's Room
                icon: mdi:bed-single
              - type: custom:mushroom-climate-card
                entity: climate.wiser_alexander_s_room
                name: Alex's Room
                hvac_modes:
                  - "off"
                  - heat
                  - auto
                fill_container: true
              - type: entities
                title: Environment
                show_header_toggle: false
                entities:
                  - sensor.wiser_lts_temperature_alexander_s_room
          # ---- Main Bathroom ----
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: "#main_bathroom"
                name: Main Bathroom
                icon: mdi:bathtub
              - type: entities
                title: Environment
                show_header_toggle: false
                entities:
                  - sensor.main_bathroom_temperature_humidity_sensor_temperature
                  - sensor.main_bathroom_temperature_humidity_sensor_humidity
                  - sensor.main_bathroom_temperature_humidity_sensor_atmospheric_pressure
                  - sensor.main_bathroom_temperature_humidity_sensor_battery
          # ---- Ensuite ----
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: "#ensuite"
                name: Ensuite
                icon: mdi:shower-head
              - type: entities
                title: Environment
                show_header_toggle: false
                entities:
                  - sensor.ensuite_temperature_humidity_sensor_temperature
                  - sensor.ensuite_temperature_humidity_sensor_humidity
                  - sensor.ensuite_temperature_humidity_sensor_atmospheric_pressure
                  - sensor.ensuite_temperature_humidity_sensor_battery
          # ---- Attic (AMS sensors live here, not on other dashboards) ----
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: "#attic"
                name: Attic
                icon: mdi:home-roof
              - type: custom:mushroom-climate-card
                entity: climate.wiser_attic
                name: Attic
                hvac_modes:
                  - "off"
                  - heat
                  - auto
                fill_container: true
              - type: entities
                title: Attic
                show_header_toggle: false
                entities:
                  - switch.attic_clothes_rail
                  - sensor.wiser_lts_temperature_attic
                  - sensor.ams_temperature_humidity_sensor_temperature
                  - sensor.ams_temperature_humidity_sensor_humidity
                  - sensor.ams_temperature_humidity_sensor_pressure
                  - sensor.ams_temperature_humidity_sensor_battery
      # =======================================================
      # Tiles — floor-grouped grids with columns:4 for density
      # =======================================================
      - title: Ground floor
        column_span: 4
        cards:
          - type: grid
            columns: 4
            square: false
            cards:
              - type: custom:streamline-card
                template: room_tile
                variables:
                  primary: Kitchen
                  secondary: "{{ states('sensor.wiser_lts_temperature_kitchen_dining_room') }}°C"
                  icon: mdi:silverware-fork-knife
                  color: amber
                  hash: "#kitchen"
              - type: custom:streamline-card
                template: room_tile
                variables:
                  primary: Sitting
                  secondary: "{{ states('sensor.wiser_lts_temperature_sitting_room') }}°C"
                  icon: mdi:sofa
                  color: deep-orange
                  hash: "#sitting_room"
              - type: custom:streamline-card
                template: room_tile
                variables:
                  primary: Hall
                  secondary: >-
                    {% if is_state('binary_sensor.hall_front_door_sensor_contact','on') %}Door open{% else %}{{ states('sensor.hall_motion_sensor_temperature') }}°C{% endif %}
                  icon: mdi:door-open
                  color: teal
                  hash: "#hall"
              - type: custom:streamline-card
                template: room_tile
                variables:
                  primary: Marie Office
                  secondary: "{{ states('sensor.wiser_lts_temperature_marie_s_office') }}°C"
                  icon: mdi:desk
                  color: purple
                  hash: "#marie_office"
              - type: custom:streamline-card
                template: room_tile
                variables:
                  primary: Outside
                  secondary: "{{ state_attr('weather.home','temperature') }}°C"
                  icon: mdi:leaf
                  color: green
                  hash: "#outside"
      - title: First floor
        column_span: 4
        cards:
          - type: grid
            columns: 4
            square: false
            cards:
              - type: custom:streamline-card
                template: room_tile
                variables:
                  primary: Bedroom
                  secondary: "{{ states('sensor.wiser_lts_temperature_bedroom') }}°C · {{ states('sensor.wiser_lts_humidity_bedroom') }}%"
                  icon: mdi:bed-queen
                  color: indigo
                  hash: "#bedroom"
              - type: custom:streamline-card
                template: room_tile
                variables:
                  primary: Landing
                  secondary: "{{ states('sensor.landing_motion_sensor_temperature') }}°C"
                  icon: mdi:stairs
                  color: grey
                  hash: "#landing"
              - type: custom:streamline-card
                template: room_tile
                variables:
                  primary: Hugh Office
                  secondary: "{{ states('sensor.wiser_lts_temperature_hugh_s_office') }}°C"
                  icon: mdi:monitor-dashboard
                  color: pink
                  hash: "#office"
              - type: custom:streamline-card
                template: room_tile
                variables:
                  primary: Lily
                  secondary: "{{ states('sensor.wiser_lts_temperature_lily_s_room') }}°C"
                  icon: mdi:bed-single
                  color: pink
                  hash: "#lily_room"
              - type: custom:streamline-card
                template: room_tile
                variables:
                  primary: Alex
                  secondary: "{{ states('sensor.wiser_lts_temperature_alexander_s_room') }}°C"
                  icon: mdi:bed-single
                  color: cyan
                  hash: "#alex_room"
              - type: custom:streamline-card
                template: room_tile
                variables:
                  primary: Main Bath
                  secondary: "{{ states('sensor.main_bathroom_temperature_humidity_sensor_temperature') }}°C"
                  icon: mdi:bathtub
                  color: blue
                  hash: "#main_bathroom"
              - type: custom:streamline-card
                template: room_tile
                variables:
                  primary: Ensuite
                  secondary: "{{ states('sensor.ensuite_temperature_humidity_sensor_temperature') }}°C"
                  icon: mdi:shower-head
                  color: blue
                  hash: "#ensuite"
      - title: Attic
        column_span: 4
        cards:
          - type: grid
            columns: 4
            square: false
            cards:
              - type: custom:streamline-card
                template: room_tile
                variables:
                  primary: Attic
                  secondary: "{{ states('sensor.wiser_lts_temperature_attic') }}°C · {{ states('sensor.ams_temperature_humidity_sensor_humidity') }}%"
                  icon: mdi:home-roof
                  color: brown
                  hash: "#attic"
