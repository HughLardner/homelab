views:
  - title: System
    path: default_view
    type: sections
    icon: mdi:tools
    max_columns: 4
    sections:
      # ===========================================================
      # Printer pop-up (its own vertical-stack per bubble-card v2)
      # ===========================================================
      - type: grid
        column_span: 4
        cards:
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: pop-up
                hash: "#printer"
                name: Brother DCP-L3550CDW
                icon: mdi:printer
              - type: entities
                title: Toner / drum / status
                show_header_toggle: false
                entities:
                  - sensor.dcp_l3550cdw_status
                  - sensor.dcp_l3550cdw_black_toner_remaining
                  - sensor.dcp_l3550cdw_cyan_toner_remaining
                  - sensor.dcp_l3550cdw_magenta_toner_remaining
                  - sensor.dcp_l3550cdw_yellow_toner_remaining
                  - sensor.dcp_l3550cdw_drum_remaining_life
                  - sensor.dcp_l3550cdw_duplex_unit_page_counter
                  - sensor.dcp_l3550cdw_page_counter
                  - sensor.dcp_l3550cdw_color_counter
                  - sensor.dcp_l3550cdw_b_w_counter
      # ===========================================================
      # Health summary chips
      # ===========================================================
      - title: Health summary
        column_span: 4
        cards:
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                icon: mdi:package-up
                icon_color: orange
                content: >-
                  {{ states.update | selectattr('state','eq','on') | list | count }} updates
              - type: template
                icon: mdi:battery-alert-variant-outline
                icon_color: red
                content: >-
                  {{ states.sensor
                     | selectattr('attributes.device_class','defined')
                     | selectattr('attributes.device_class','eq','battery')
                     | rejectattr('state','in',['unknown','unavailable'])
                     | selectattr('state','lt','25')
                     | list | count }} low batteries
                tap_action:
                  action: navigate
                  navigation_path: /entity-health
              - type: template
                icon: mdi:help-network-outline
                icon_color: grey
                content: >-
                  {{ states
                     | selectattr('state','eq','unavailable')
                     | list | count }} unavailable
              - type: entity
                entity: sensor.backup_backup_manager_state
                icon: mdi:backup-restore
                icon_color: blue
                content_info: state
              - type: action
                icon: mdi:cloud-upload-outline
                icon_color: green
                content: Run backup
                tap_action:
                  action: perform-action
                  perform_action: backup.create_automatic
              - type: template
                icon: mdi:heart-pulse
                icon_color: pink
                content: Entity health
                tap_action:
                  action: navigate
                  navigation_path: /entity-health
              - type: template
                icon: mdi:printer
                icon_color: blue
                content: Printer
                tap_action:
                  action: navigate
                  navigation_path: "#printer"
      # ===========================================================
      # Updates split into HACS / core integration / add-on groups
      # (v3 split: v2 had one catch-all auto-entities list which
      # was hard to scan)
      # ===========================================================
      - title: HACS & frontend updates
        column_span: 2
        cards:
          - type: custom:auto-entities
            card:
              type: entities
              title: Frontend / HACS
              show_header_toggle: false
            filter:
              include:
                - domain: update
                  entity_id: "*hacs*"
                  state: "on"
                - domain: update
                  entity_id: "*frontend*"
                  state: "on"
                - domain: update
                  entity_id: "*lovelace*"
                  state: "on"
            sort:
              method: friendly_name
            show_empty: true
      - title: Integration updates
        column_span: 2
        cards:
          - type: custom:auto-entities
            card:
              type: entities
              title: Integrations
              show_header_toggle: false
            filter:
              include:
                - domain: update
                  state: "on"
              exclude:
                - entity_id: "*hacs*"
                - entity_id: "*frontend*"
                - entity_id: "*lovelace*"
            sort:
              method: friendly_name
            show_empty: true
      # ===========================================================
      # Unavailable entities grouped by domain (v3: two stacks side
      # by side — sensors vs everything else — easier to scan)
      # ===========================================================
      - title: Unavailable sensors
        column_span: 2
        cards:
          - type: custom:auto-entities
            card:
              type: entities
              title: sensor.* = unavailable
              show_header_toggle: false
            filter:
              include:
                - domain: sensor
                  state: unavailable
                  options:
                    secondary_info: last-changed
              exclude:
                - entity_id: "*_signal$"
            sort:
              method: last_changed
            show_empty: true
      - title: Unavailable devices / other
        column_span: 2
        cards:
          - type: custom:auto-entities
            card:
              type: entities
              title: Non-sensor = unavailable
              show_header_toggle: false
            filter:
              include:
                - state: unavailable
                  options:
                    secondary_info: last-changed
              exclude:
                - domain: sensor
            sort:
              method: last_changed
            show_empty: true
      # ===========================================================
      # Backups + HA host info (v3: dropped sun.sun + zone.home,
      # they belong on an astronomical dashboard, not here)
      # ===========================================================
      - title: Backups
        column_span: 2
        cards:
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.backup_backup_manager_state
                name: Manager state
              - entity: sensor.backup_last_attempted_automatic_backup
                name: Last attempted
              - entity: sensor.backup_last_successful_automatic_backup
                name: Last successful
              - entity: sensor.backup_next_scheduled_automatic_backup
                name: Next scheduled
          - type: custom:mushroom-template-card
            primary: Run backup now
            secondary: backup.create_automatic
            icon: mdi:cloud-upload-outline
            icon_color: green
            fill_container: true
            layout: vertical
            tap_action:
              action: perform-action
              perform_action: backup.create_automatic
      - title: HA host
        column_span: 2
        cards:
          - type: entities
            show_header_toggle: false
            entities:
              - entity: device_tracker.homeassistant
                name: Home Assistant host
              - entity: update.hacs_update
                name: HACS
              - entity: update.drayton_wiser_integration_for_home_assistant_update
                name: Drayton Wiser integration
              - entity: update.myenergi_update
                name: myenergi integration
              - entity: update.openid_connect_update
                name: OpenID Connect
              - entity: update.node_red_companion_update
                name: Node-RED Companion
